<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🔥 Dükkan Oyunu</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #121212;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .shop-box {
      text-align: center;
      background: #1f1f1f;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      width: 360px;
    }

    h1 {
      margin-bottom: 10px;
    }

    #score {
      font-size: 22px;
      margin: 20px 0;
    }

    button {
      background: #ff9800;
      border: none;
      color: white;
      padding: 15px 25px;
      font-size: 18px;
      border-radius: 12px;
      cursor: pointer;
      margin: 10px;
      transition: 0.2s;
    }

    button:hover {
      transform: scale(1.05);
    }

    #buyBtn {
      background: #e53935;
    }
  </style>
</head>
<body>
  <div class="shop-box">
    <h1>🔥 Dükkan Oyunu</h1>
    <p>1000 kere bas ve ateşi satın al!</p>

    <div id="score">Tıklama: 0 / 1000</div>

    <button onclick="increaseScore()">BAS!</button>
    <br>
    <button id="buyBtn" onclick="buyFire()">🔥 Satın Al</button>
  </div>

  <script>
    let score = 0;
    let bought = false;

    function increaseScore() {
      if (!bought) {
        score++;
        document.getElementById('score').innerText = 'Tıklama: ' + score + ' / 1000';
      }
    }

    function buyFire() {
      if (score >= 1000 && !bought) {
        bought = true;
        document.getElementById('score').innerText = 'Tebrikler! 🔥 satın alındı!';
        alert('Başardın! 1000 tıklama ile 🔥 satın aldın!');
      } else if (!bought) {
        alert('Henüz yeterli tıklaman yok! 1000 kere basmalısın.');
      }
    }
  </script>
</body>
</html>
